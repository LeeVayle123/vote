<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>S·Vote — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <style>
    body.login-page {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #ece9ff 50%, #f5f0ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-shell {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .login-box {
      width: min(400px, 100%);
      background: #ffffff;
      border-radius: 32px;
      padding: 40px 32px;
      box-shadow: 
        0 10px 30px rgba(99, 56, 242, 0.05),
        0 30px 60px rgba(99, 56, 242, 0.1);
      border: 1px solid rgba(99, 56, 242, 0.08);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      gap: 10px;
    }
    .login-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #6338f2, #a78bfa);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(99, 56, 242, 0.25);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      color: #1e1b4b;
      letter-spacing: -0.5px;
    }
    .logo span {
      color: #6338f2;
    }
    .admin-badge {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(135deg, rgba(99, 56, 242, 0.1), rgba(99, 56, 242, 0.05));
      color: #6338f2;
      padding: 6px 14px;
      border-radius: 99px;
      border: 1px solid rgba(99, 56, 242, 0.15);
    }
    .login-header h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #1e1b4b;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: -0.5px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .field-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #4b5563;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-with-icon {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .form-input {
      width: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px 16px 14px 46px;
      font-size: 0.95rem;
      color: #1f2937;
      background: #f9fafb;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      box-sizing: border-box;
    }
    .form-input:focus {
      border-color: #6338f2;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 56, 242, 0.12);
    }
    .form-input:focus + .input-icon {
      color: #6338f2;
    }
    .btn-login {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, #6338f2, #8b5cf6);
      color: #ffffff;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(99, 56, 242, 0.3);
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      margin-top: 20px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(99, 56, 242, 0.4);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 14px;
      padding: 14px;
      color: #dc2626;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 18px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-footnote {
      font-size: 0.78rem;
      color: #9ca3af;
      text-align: center;
      margin-top: 24px;
      font-weight: 500;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-box">
      <div class="login-brand">
        <div class="login-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a3 3 0 1 1 0 6a3 3 0 0 1 0-6zm0 7.5c-4 0-7.5 2-7.5 4.5V19.5h15v-3c0-2.5-3.5-4.5-7.5-4.5z"/></svg>
        </div>
        <div class="logo">S<span>·</span>Vote</div>
        <div class="admin-badge">Accès Enseignant</div>
      </div>
      <div class="login-header">
        <h1>Admin</h1>
      </div>

      <form method="POST" action="/admin/login">
        <div class="form-group">
          <div class="field-label">Nom d'utilisateur admin</div>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" class="form-input" name="username" placeholder="Nom d'utilisateur admin" required/>
          </div>
        </div>
        
        <div class="form-group">
          <div class="field-label">Mot de passe</div>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </span>
            <input type="password" class="form-input" name="password" placeholder="Mot de passe" required/>
          </div>
        </div>

        {% if error %}
        <div class="error-msg">🚫 {{ error }}</div>
        {% endif %}

        <button type="submit" class="btn-login">Se connecter</button>
      </form>

      <p class="login-footnote">Interface réservée aux administrateurs</p>
    </div>
  </div>
</body>
</html>
